<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexCar Spin Wheel</title>
    <meta
      name="description"
      content="Try your luck with FlexCar's Spin Wheel for a chance to win amazing prizes."
    />
    <link rel="icon" href="/assets/images/buttons/spin-button.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div class="container">
        <img class="notch" src="/assets/images/notch.svg" alt="" />
        <button
          type="button"
          class="settings-button button"
          aria-label="Open settings"
        >
          <img src="/assets/images/buttons/settings-button.svg" alt="" />
        </button>
        <div class="grid"></div>
        <div class="bottom-shadow"></div>
        <div class="wheel-container">
          <img class="wheel-arrow" src="/assets/images/arrow.svg" alt="" />
          <img
            class="wheel-background"
            src="/assets/images/spin-wheel.svg"
            alt=""
          />
          <div id="wheel-stage" class="wheel"></div>
          <button type="button" class="spin-button button" aria-label="Spin the wheel">
            <img src="/assets/images/buttons/spin-button.svg" alt="" />
          </button>
        </div>
        <div class="pacman-container">
          <div class="pacman-wrapper">
            <img
              src="/assets/images/suv-runner.png"
              alt=""
              class="pacman"
              aria-hidden="true"
            />
            <div class="dots"></div>
          </div>
        </div>
      </div>

      <div class="settings-menu modal-container" data-state="closed">
        <div class="modal">
          <button
            type="button"
            class="close-modal-btn button"
            aria-label="Close settings"
          >
            <img src="/assets/images/buttons/close-button.svg" alt="" />
          </button>

          <div class="modal-content">
            <h2 class="settings-title">Settings</h2>

            <div class="prizes-table">
              <div class="prizes-header">
                <h3 class="prizes-title">Prizes</h3>
                <span>Probability</span>
                <span>Type</span>
                <span>Rearrange</span>
                <span>Remove</span>
              </div>

              <ul class="prizes"></ul>

              <button type="button" class="add-prize-button">+ Add prize</button>
            </div>

            <div class="modal-buttons two">
              <button
                type="button"
                class="settings-cancel modal-button button"
                aria-label="Cancel settings"
              >
                <img src="/assets/images/buttons/cancel-button.svg" alt="" />
              </button>

              <button
                type="button"
                class="settings-apply modal-button button"
                aria-label="Apply settings"
              >
                <img src="/assets/images/buttons/apply-button.svg" alt="" />
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="winning-modal modal-container" data-state="closed">
        <div class="modal">
          <button
            type="button"
            class="close-modal-btn button"
            aria-label="Close winning modal"
          >
            <img src="/assets/images/buttons/close-button.svg" alt="" />
          </button>

          <div class="modal-content">
            <img class="you-won" src="/assets/images/you-won.svg" alt="You won" />
            <img class="winning-prize-img" alt="" />
            <div class="winning-prize-info"></div>
          </div>
        </div>
      </div>

      <div class="try-again-modal modal-container" data-state="closed">
        <div class="modal">
          <button
            type="button"
            class="close-modal-btn button"
            aria-label="Close try again modal"
          >
            <img src="/assets/images/buttons/close-button.svg" alt="" />
          </button>

          <div class="modal-content">
            <div class="try-again-img">
              <img src="/assets/images/prizes/try-again.webp" alt="" />
            </div>

            <div class="try-again-info">
              <h3 class="try-again-title">Sorry, you are already Flex</h3>
              <p class="try-again-description">
                Don't worry, you can try again in the future
              </p>
            </div>
          </div>

          <div class="modal-buttons one">
            <button
              type="button"
              class="retry-button modal-button button"
              aria-label="Close and try again later"
            >
              <img src="/assets/images/buttons/retry-button.svg" alt="" />
            </button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
